<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --pink: #fb7299;
    --pink-dark: #e85d85;
    --text: #1a1a1a;
    --text-2: #6b6b6b;
    --muted: #999;
    --bg: #ffffff;
    --border: #e8e8e8;
    --bg-soft: #f9f9f9;
    --success: #52c41a;
    --success-bg: #f6ffed;
    --error: #ff4d4f;
    --error-bg: #fff2f0;
    --info: #1890ff;
    --info-bg: #e6f7ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px 20px;
  }

  .header {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 16px;
  }
  .header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--pink);
  }
  .header h1 { font-size: 16px; font-weight: 600; }

  .input-row {
    display: flex; gap: 8px; margin-bottom: 12px;
  }
  input {
    flex: 1; padding: 8px 12px; font-size: 13px;
    font-family: "SF Mono", Consolas, monospace;
    border: 1px solid var(--border); border-radius: 6px;
    background: #fafafa; transition: all .15s;
  }
  input:focus {
    outline: none; border-color: var(--pink);
    box-shadow: 0 0 0 2px rgba(251,114,153,.1);
    background: #fff;
  }
  button {
    padding: 7px 16px; font-size: 13px; font-weight: 500;
    border: 1px solid transparent; border-radius: 6px;
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .btn-primary { background: var(--pink); color: #fff; }
  .btn-primary:hover { background: var(--pink-dark); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--text-2); border-color: var(--border); }
  .btn-ghost:hover { background: #f5f5f5; }
  .btn-save { background: #fff; color: var(--pink); border-color: var(--pink); width: 100%; }
  .btn-save:hover { background: var(--pink); color: #fff; }
  .btn-start { background: var(--pink); color: #fff; width: 100%; }
  .btn-start:hover { background: var(--pink-dark); }
  .btn-config { background: transparent; color: var(--muted); font-size: 12px; border-color: var(--border); }
  .btn-config:hover { color: var(--text-2); }

  .status {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 4px;
    font-size: 12px; font-weight: 500; margin-bottom: 12px;
  }
  .status.idle { background: #f5f5f5; color: var(--muted); }
  .status.fetching, .status.downloading { background: var(--info-bg); color: var(--info); }
  .status.done { background: var(--success-bg); color: var(--success); }
  .status.error { background: var(--error-bg); color: var(--error); }
  .status .s-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .status.fetching .s-dot, .status.downloading .s-dot { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .progress-track {
    width: 100%; height: 5px; background: #f0f0f0;
    border-radius: 3px; overflow: hidden; margin-bottom: 4px;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: var(--pink); border-radius: 3px;
    transition: width .3s;
  }
  .progress-text { font-size: 11px; color: var(--muted); margin-bottom: 12px; }

  .info-card {
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 14px;
    display: none; margin-bottom: 12px;
  }
  .info-card.show { display: block; }
  .info-row { display: flex; font-size: 12px; line-height: 1.6; }
  .info-label { color: var(--muted); width: 50px; flex-shrink: 0; }
  .info-value { color: var(--text); flex: 1; word-break: break-all; }

  .server-panel {
    background: #fffbe6; border: 1px solid #ffe58f;
    border-radius: 8px; padding: 14px 16px; margin-bottom: 12px;
    display: none;
  }
  .server-panel.show { display: block; }
  .server-panel p { font-size: 12px; line-height: 1.6; color: #614700; margin-bottom: 10px; }
  .server-panel .path { font-family: monospace; font-size: 11px; color: var(--muted); word-break: break-all; margin-bottom: 10px; }

  .save-action { display: none; margin-bottom: 12px; }
  .save-action.show { display: block; }

  .footer {
    margin-top: 16px; padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted); text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <span class="dot"></span>
  <h1>B站视频下载</h1>
</div>

<div class="server-panel" id="serverPanel">
  <p id="serverMsg">本地服务未运行，请先启动：</p>
  <div class="path" id="serverPathDisplay"></div>
  <button class="btn-start" onclick="doStartServer()">启动服务</button>
  <button class="btn-config" onclick="doSelectBat()">更改 .bat 路径</button>
</div>

<div class="input-row">
  <input type="text" id="urlInput" placeholder="粘贴 B站视频链接..." />
  <button class="btn-primary" id="dlBtn" onclick="startDownload()">下载</button>
</div>

<div class="status idle" id="statusBadge">
  <span class="s-dot"></span>
  <span id="statusText">就绪</span>
</div>

<div class="info-card" id="infoCard">
  <div class="info-row"><span class="info-label">标题</span><span class="info-value" id="iTitle">-</span></div>
  <div class="info-row"><span class="info-label">UP主</span><span class="info-value" id="iUploader">-</span></div>
  <div class="info-row"><span class="info-label">时长</span><span class="info-value" id="iDuration">-</span></div>
  <div class="info-row"><span class="info-label">ID</span><span class="info-value" id="iId">-</span></div>
</div>

<div class="progress-track"><div class="progress-fill" id="pFill"></div></div>
<div class="progress-text" id="pText">0%</div>

<div class="save-action" id="saveAction">
  <button class="btn-save" onclick="saveFile()">保存到下载文件夹</button>
</div>

<div class="footer">
  yt-dlp · <span id="footerLink">GitHub</span> · 仅供学习
</div>

<script>
const API = 'http://127.0.0.1:19945';
let pollTimer = null;
let fileName = null;
let autoUrl = null;

// uTools 入口
if (window.utools) {
  utools.onPluginEnter(action => {
    if (action.type === 'regex') {
      autoUrl = action.payload;
      document.getElementById('urlInput').value = autoUrl;
    }
    utools.setExpendHeight(400);
    checkServerAndStart();
  });
} else {
  // 非 uTools 环境（浏览器测试）
  checkServer();
}

// ── 服务器检测 ──────────────────────────────────

async function checkServerAndStart() {
  const running = await checkServer();
  if (!running) {
    showServerPanel();
  } else if (autoUrl) {
    startDownload();
  }
}

function checkServer() {
  return fetch(API + '/api/status', { signal: AbortSignal.timeout(2000) })
    .then(r => r.json())
    .then(() => true)
    .catch(() => false);
}

function showServerPanel() {
  const panel = document.getElementById('serverPanel');
  const pathDisplay = document.getElementById('serverPathDisplay');
  panel.classList.add('show');
  document.getElementById('dlBtn').disabled = true;

  if (window.services) {
    const p = window.services.getServerPath();
    pathDisplay.textContent = '当前路径: ' + p;
  }
}

function doStartServer() {
  if (!window.services) {
    document.getElementById('serverMsg').textContent = '无法自动启动，请手动运行 启动.bat';
    return;
  }
  const ok = window.services.startServer();
  if (ok) {
    document.getElementById('serverMsg').textContent = '服务启动中，请稍候...';
    // 轮询等待服务器就绪
    let retries = 0;
    const waitTimer = setInterval(async () => {
      retries++;
      const ready = await checkServer();
      if (ready) {
        clearInterval(waitTimer);
        document.getElementById('serverPanel').classList.remove('show');
        document.getElementById('dlBtn').disabled = false;
        setStatus('idle', '服务已就绪');
        if (autoUrl) startDownload();
      } else if (retries > 15) {
        clearInterval(waitTimer);
        document.getElementById('serverMsg').textContent = '启动超时，请检查 Python 是否已安装';
      }
    }, 1000);
  }
}

function doSelectBat() {
  if (!window.services) return;
  const p = window.services.selectBatFile();
  if (p) {
    document.getElementById('serverPathDisplay').textContent = '已设置: ' + p;
  }
}

// ── 下载逻辑 ────────────────────────────────────

function startDownload() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { alert('请输入 B站视频链接'); return; }

  const btn = document.getElementById('dlBtn');
  btn.disabled = true; btn.textContent = '下载中';
  document.getElementById('infoCard').classList.remove('show');
  document.getElementById('saveAction').classList.remove('show');
  document.getElementById('pFill').style.width = '0%';
  document.getElementById('pText').textContent = '0%';
  setStatus('fetching', '获取视频信息...');

  fetch(API + '/api/download', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url }),
    signal: AbortSignal.timeout(5000),
  })
    .then(r => r.json())
    .then(data => {
      if (data.error) { alert(data.error); resetBtn(); }
      else { startPolling(); }
    })
    .catch(err => { alert('请求失败: ' + err); resetBtn(); });
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollStatus, 400);
}

function pollStatus() {
  fetch(API + '/api/status')
    .then(r => r.json())
    .then(data => {
      if (data.progress !== undefined && data.progress > 0) {
        document.getElementById('pFill').style.width = data.progress + '%';
        document.getElementById('pText').textContent =
          data.progress + '%  ·  ' + fmt(data.downloaded) + ' / ' + fmt(data.total) + '  ·  ' + fmt(data.speed) + '/s';
      }
      setStatus(data.state, data.message);

      if (data.video_info) {
        const c = document.getElementById('infoCard');
        c.classList.add('show');
        document.getElementById('iTitle').textContent = data.video_info.title;
        document.getElementById('iUploader').textContent = data.video_info.uploader;
        document.getElementById('iDuration').textContent = data.video_info.duration;
        document.getElementById('iId').textContent = data.video_info.id;
      }

      if (data.state === 'done') {
        clearInterval(pollTimer); pollTimer = null;
        resetBtn();
        document.getElementById('pFill').style.width = '100%';
        document.getElementById('pText').textContent = '100%';
        if (data.file_name) {
          fileName = data.file_name;
          document.getElementById('saveAction').classList.add('show');
        }
      } else if (data.state === 'error') {
        clearInterval(pollTimer); pollTimer = null;
        resetBtn();
      }
    })
    .catch(err => console.error(err));
}

function saveFile() {
  if (!fileName) return;
  const a = document.createElement('a');
  a.href = API + '/api/file?name=' + encodeURIComponent(fileName);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ── 工具方法 ────────────────────────────────────

function setStatus(state, msg) {
  const b = document.getElementById('statusBadge');
  b.className = 'status ' + state;
  document.getElementById('statusText').textContent = msg || '就绪';
}

function resetBtn() {
  const btn = document.getElementById('dlBtn');
  btn.disabled = false; btn.textContent = '下载';
}

function fmt(n) {
  if (!n) return '—';
  const u = ['B', 'KB', 'MB', 'GB'];
  for (let i of u) { if (n < 1024) return n.toFixed(1) + ' ' + i; n /= 1024; }
  return n.toFixed(1) + ' TB';
}

// 回车触发下载
document.getElementById('urlInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') startDownload();
});
</script>
</body>
</html>
